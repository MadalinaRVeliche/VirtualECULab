name: Tests

# Run the same checks for pushed commits and pull requests.
# workflow_dispatch also allows a manual run from GitHub Actions.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # These are test defaults for the application configuration.
    # The pytest fixtures override database access with SQLite for regular tests.
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: virtualeculab_test
      DB_USER: test_user
      DB_PASSWORD: test_only_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    # Frontend commands use the package.json and lockfile in frontend/.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # Check React behavior, code quality, and the production build separately.
      - name: Frontend component tests
        run: npm test

      - name: Frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  e2e:
    name: Playwright browser tests
    runs-on: ubuntu-latest

    # Use a disposable PostgreSQL service for the integration and browser
    # tests. These credentials belong only to the CI database.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: virtualeculab_e2e
          POSTGRES_USER: e2e_user
          POSTGRES_PASSWORD: e2e_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e_user -d virtualeculab_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # FastAPI runs on the job runner and reaches the service on the mapped port.
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: virtualeculab_e2e
      DB_USER: e2e_user
      DB_PASSWORD: e2e_test_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Playwright needs both the Chromium binary and its Linux dependencies.
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Import the models to register the schema, then create the tables
      # before either test suite attempts to read or write quiz data.
      - name: Create database tables
        run: |
          python -c "from backend.database import Base, engine; import backend.models; Base.metadata.create_all(bind=engine)"

      # Provide the integration test's opt-in URL explicitly. The app uses
      # the job-level DB_* settings when Playwright launches FastAPI.
      - name: PostgreSQL integration test
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://e2e_user:e2e_test_password@localhost:5432/virtualeculab_e2e
        run: python -m pytest backend/tests/test_postgres.py -q

      # Playwright's CI configuration starts FastAPI and Vite and waits for
      # both servers before driving the application in Chromium.
      - name: Run browser tests
        working-directory: frontend
        run: npx playwright test

      # Upload failed-test traces and screenshots for debugging in GitHub.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7